<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>사진 위치 → 자전거 경로 지도</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>📷 사진 위치 → 🚴 자전거 경로</h1>
    <p>
      사진을 올리면 촬영 위치를 카카오맵에 표시합니다. 사진 1장이면 그 위치를 도는 원하는 거리의 순환 경로 4개를,
      여러 장이면 사진들의 위치를 순서대로 잇는 경로 4개를 만들어 GPX로 내려받을 수 있습니다.
    </p>
  </header>

  <main>
    <section class="controls">
      <div class="field">
        <label for="photo-input">1. 사진 선택 (여러 장 가능, GPS 위치 정보 포함)</label>
        <input type="file" id="photo-input" accept="image/*" multiple />
      </div>

      <div id="photo-list" class="photo-list"></div>

      <div class="field" id="distance-field">
        <label for="distance-input">2. 원하는 경로 거리 (km)</label>
        <input type="number" id="distance-input" value="10" min="1" max="200" step="1" />
      </div>
      <p id="multi-photo-note" class="note" hidden>
        사진 여러 장의 위치를 순서대로 잇는 경로가 만들어집니다. 그 경로가 입력한 거리보다 짧으면
        마지막 사진 위치에서 부족한 만큼 순환 구간을 추가하고, 이미 더 길면 입력한 거리는 무시합니다.
      </p>

      <button id="generate-btn" disabled>경로 4개 생성</button>
      <p id="status-message" class="status"></p>
    </section>

    <section id="map" class="map"></section>

    <section id="route-list" class="route-list"></section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
